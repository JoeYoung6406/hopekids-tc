<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>機器人大樓 · Hope Kids 自動化監控</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#2b2f36; --muted:#6b7280; --paper:#ffffff;
    --frame:#4d5868;
    --hk-wall:#fff4d1; --hk-floor:#ecd9a0;
    --ln-wall:#e2f5ea; --ln-floor:#bfe2cd;
    --new-wall:#ece8f8; --new-floor:#cfc6ea;
    --srv-wall:#2c3646; --srv-floor:#1f2733;
    --sun:#ffc33b; --red:#e5484d; --amber:#f2a900; --green:#1aa36b;
    --cork:#c99d66; --note:#fff1a6; --note-alert:#ffd4d0; --note-ok:#d6f3e3; --note-todo:#ffe6b8; --note-info:#dbe9ff;
    --sky-top:#1b2746; --sky-bot:#34477a; --sky-ink:#eef2fb;
    --hand:"LXGW WenKai TC","Noto Sans TC",serif;
    --sans:"Noto Sans TC",system-ui,"Microsoft JhengHei",sans-serif;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; font-family:var(--sans); color:var(--ink); font-size:15px; line-height:1.55;
    background:linear-gradient(180deg,var(--sky-top) 0,var(--sky-bot) 100%);
    min-height:100dvh;
  }
  .wrap{max-width:1080px; margin:0 auto; padding-inline:16px; padding-block:22px 0; position:relative}
  button{font:inherit; color:inherit}
  :focus-visible{outline:3px solid var(--sun); outline-offset:3px; border-radius:6px}

  /* ---------- 天空 ---------- */
  .sky{position:absolute; inset:0 0 auto 0; height:520px; overflow:hidden; pointer-events:none}
  .stars{position:absolute; inset:0; opacity:0; transition:opacity .6s}
  body.ph-night .stars{opacity:1}
  .stars i{position:absolute; width:2px; height:2px; background:#fff; border-radius:50%}
  .orb{position:absolute; right:3%; top:-4px; width:48px; height:48px; border-radius:50%}
  body.ph-day .orb{background:#ffd75a; box-shadow:0 0 50px 14px rgba(255,215,90,.55)}
  body.ph-dawn .orb,body.ph-dusk .orb{background:#ffb35a; box-shadow:0 0 50px 16px rgba(255,150,80,.5)}
  body.ph-night .orb{box-shadow:inset -13px 7px 0 0 #f3efe0; filter:drop-shadow(0 0 10px rgba(243,239,224,.4)); transform:rotate(-20deg)}

  /* ---------- 頂部 ---------- */
  .top{display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:12px 24px; color:var(--sky-ink); position:relative}
  .clock-big{font-weight:900; font-size:clamp(2.6rem,7vw,3.6rem); line-height:1; letter-spacing:.01em; font-variant-numeric:tabular-nums}
  .clock-big small{font-size:.42em; font-weight:700; opacity:.7; margin-left:.25em}
  .clock-date{font-size:.95rem; opacity:.85; margin-top:6px}
  .summary{flex:1 1 320px; max-width:560px}
  .summary p{margin:0; font-size:1.05rem; font-weight:700}
  .fresh{display:flex; flex-wrap:wrap; align-items:center; gap:6px 14px; margin-top:8px; font-size:.85rem; opacity:.9}
  .fresh .warn{color:#ffd2cc; font-weight:700}
  body.ph-day .fresh .warn,body.ph-dawn .fresh .warn{color:#a3191f}
  .btn-refresh{background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.35); color:var(--sky-ink); border-radius:999px; padding:4px 14px; cursor:pointer; font-size:.85rem}
  .btn-refresh:hover{background:rgba(255,255,255,.26)}
  body.ph-day .btn-refresh,body.ph-dawn .btn-refresh{background:rgba(255,255,255,.55); border-color:rgba(43,47,54,.25)}
  .oops{display:none; margin-top:12px; background:#ffd4d0; color:#8f1d22; border-radius:8px; padding:8px 12px; font-size:.88rem}

  /* ---------- 公告欄 ---------- */
  .board{position:relative; margin-top:22px; background:var(--cork); border:8px solid #8a6a43; border-radius:6px;
    padding:14px; display:flex; flex-wrap:wrap; gap:12px;
    background-image:radial-gradient(rgba(90,60,30,.18) 1px,transparent 1.5px); background-size:7px 7px}
  .board h2{margin:0; flex-basis:100%; font-family:var(--hand); font-weight:700; font-size:1.1rem; color:#4a3313}
  .note{font-family:var(--hand); font-size:1rem; line-height:1.5; background:var(--note); padding:12px 14px; border:0; text-align:left;
    flex:1 1 230px; max-width:360px; box-shadow:0 3px 6px rgba(60,40,20,.25); position:relative; cursor:pointer; color:#3a3326}
  .note::before{content:""; position:absolute; top:-6px; left:50%; width:12px; height:12px; margin-left:-6px; border-radius:50%; background:#d64545; box-shadow:0 2px 2px rgba(0,0,0,.3)}
  .note:nth-child(odd){transform:rotate(-1.2deg)} .note:nth-child(even){transform:rotate(1deg)}
  .note.alert{background:var(--note-alert)} .note.ok{background:var(--note-ok); cursor:default} .note.todo{background:var(--note-todo)} .note.info{background:var(--note-info)}
  .note.ok::before{background:var(--green)} .note.info::before{background:#3b82f6}

  /* ---------- 大樓 ---------- */
  .building{margin-top:34px; position:relative}
  .roof{position:relative; height:64px; display:flex; justify-content:center; align-items:flex-end}
  .roof::before{content:""; position:absolute; left:6px; right:6px; bottom:0; height:16px; background:var(--frame); border-radius:6px 6px 0 0}
  .sign{position:relative; z-index:1; margin-bottom:16px; background:var(--sun); color:#4a3510; font-family:var(--hand); font-weight:700;
    font-size:clamp(1.15rem,3.6vw,1.6rem); padding:4px 22px 6px; border-radius:8px; border:3px solid #a8790a;
    box-shadow:0 0 0 3px rgba(255,195,59,.25), 0 6px 18px rgba(255,195,59,.35)}
  .sign::before,.sign::after{content:""; position:absolute; bottom:-19px; width:5px; height:16px; background:#6b5426}
  .sign::before{left:24%} .sign::after{right:24%}
  .floors{border:6px solid var(--frame); border-top:0; background:var(--frame); display:grid; gap:6px}
  .floor{position:relative; padding:12px 14px 0; transition:filter .6s}
  .floor-hk{background:var(--hk-wall); box-shadow:inset 0 -10px 0 var(--hk-floor)}
  .floor-ln{background:var(--ln-wall); box-shadow:inset 0 -10px 0 var(--ln-floor)}
  .floor-new{background:var(--new-wall); box-shadow:inset 0 -10px 0 var(--new-floor)}
  .floor-srv{background:var(--srv-wall); box-shadow:inset 0 -10px 0 var(--srv-floor); color:#e7ebf1}
  .floor.dim{filter:brightness(.9) saturate(.92)}
  .floor-sign{margin:0; display:flex; flex-wrap:wrap; align-items:baseline; gap:2px 10px; font-family:var(--hand); font-weight:700; font-size:1.1rem}
  .floor-sign .lvl{font-family:var(--sans); font-weight:900; font-size:.8rem; background:var(--frame); color:#fff; border-radius:4px; padding:1px 7px}
  .floor-sign .sub{font-family:var(--sans); font-weight:400; font-size:.8rem; color:var(--muted)}
  .floor-srv .floor-sign .sub{color:#9aa6b6}
  .room{display:flex; gap:12px; align-items:flex-end; padding:6px 0 20px}
  .desks{flex:1 1 auto; min-width:0; display:grid; grid-template-columns:repeat(auto-fill,minmax(172px,1fr)); gap:4px 10px}
  .lounge{flex:0 0 250px; align-self:flex-start; margin-top:4px}
  .lounge svg{display:block; width:100%; height:auto; overflow:visible}

  /* ---------- 工位 ---------- */
  .station{background:none; border:0; padding:4px 4px 10px; text-align:left; cursor:pointer; border-radius:10px; display:flex; flex-direction:column; gap:1px}
  .station:hover{background:rgba(255,255,255,.35)}
  .floor-srv .station:hover{background:rgba(255,255,255,.06)}
  .door-slot{cursor:default} .door-slot:hover{background:none!important}
  .scene{width:100%; height:auto; display:block; overflow:visible}
  .plate{display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; margin-top:2px}
  .nm{font-weight:900; font-size:1.02rem}
  .rl{font-size:.8rem; color:var(--muted)}
  .floor-srv .rl{color:#9aa6b6}
  .stat{font-size:.86rem; font-weight:700}
  .meta{font-size:.78rem; color:var(--muted)}
  .floor-srv .meta{color:#9aa6b6}
  .st-work .stat{color:var(--green)} .st-fail .stat,.st-miss .stat{color:var(--red)}
  .st-soon .stat{color:#b07a00} .st-idle .stat,.st-leave .stat{color:#5b6472} .st-unknown .stat{color:var(--muted)}
  .floor-srv .st-idle .stat{color:#b9c4d2}
  .st-fail,.st-miss{box-shadow:inset 0 0 0 2px rgba(229,72,77,.55)}

  /* 桌子場景 */
  .glow{fill:#ffe28a; opacity:0; transition:opacity .4s}
  .chair rect{fill:#7b8594}
  .desk{fill:#a77b4f} .desk-leg{fill:#8a6440}
  .mon-frame,.mon-stand{fill:#3b4350}
  .screen{fill:#1c222b; transition:fill .4s}
  .code,.bang,.sticky,.leave-sign{display:none}
  .code rect{fill:#5ee0c7}
  .bang{font-family:var(--sans); font-weight:900; font-size:22px; text-anchor:middle; fill:#fff}
  .sticky rect{fill:#ffe45c}
  .sticky text,.leave-sign text{font-family:var(--hand); font-size:11px; font-weight:700; fill:#7a1f1f; text-anchor:middle}
  .leave-sign rect{fill:#f3f0e6; stroke:#9aa3ae}
  .leave-sign text{fill:#4d5868}
  .st-work .glow{opacity:.55}
  .st-work .code{display:inline} .st-work .screen{fill:#10303a}
  .st-work .code rect{animation:flick 1.6s steps(4) infinite}
  .st-soon .screen{fill:#20406c}
  .st-fail .screen{fill:#6b1f24} .st-fail .bang{display:inline}
  .st-miss .sticky{display:inline}
  .st-leave .leave-sign{display:inline}

  /* 交誼廳 */
  .win-frame{fill:#8a96a8} .win-sky{fill:var(--sky-top); transition:fill .6s}
  .win-bar{stroke:#8a96a8; stroke-width:3}
  .sofa-back{fill:#5f7ea8} .sofa-seat{fill:#7695bf} .sofa-arm{fill:#56739b} .sofa-leg{fill:#3d4a5c}
  .counter{fill:#a77b4f} .machine{fill:#4d5868} .machine-led{fill:#36d399}
  .cup{fill:#fffdf6}
  .steam path{fill:none; stroke:rgba(255,255,255,.75); stroke-width:2; stroke-linecap:round; opacity:0}
  .lounge.has-coffee .steam path{animation:steam 2.4s ease-out infinite}
  .lounge.has-coffee .steam path+path{animation-delay:1.2s}
  .plant-pot{fill:#c56a4a} .plant-leaf{fill:#3fa66b}

  /* 1F */
  .pc-body{fill:#c9d2dc} .pc-face{fill:#fffdf6; stroke:#4d5868; stroke-width:2.5}
  .pc-tick{stroke:#4d5868; stroke-width:1.6}
  .hand-h,.hand-m{stroke:#2b2f36; stroke-linecap:round; transform-origin:80px 40px}
  .hand-h{stroke-width:3.2} .hand-m{stroke-width:2}
  .pc-slot{fill:#4d5868} .pc-card{fill:#f6efe0; stroke:#b8ad96}
  .pc-led{fill:#36d399}
  .st-miss .pc-led{fill:var(--red); animation:blink 1s steps(2) infinite}
  .st-unknown .pc-led{fill:#9aa3ae}
  .st-work .pc-box{animation:ring .18s linear infinite; transform-box:fill-box; transform-origin:50% 100%}
  .shelf{fill:#4d5868}
  .safe-body{fill:#5f6b7c; stroke:#8996a8; stroke-width:2} .safe-door{fill:#6f7c8f} .safe-dial{fill:#c9d2dc}
  .tag{stroke:#8996a8; stroke-width:1}
  .tag-ok{fill:#d6f3e3} .tag-warn{fill:#ffe6b8} .tag-bad{fill:#ffd4d0}
  .tag-t{font-family:var(--sans); font-size:9.5px; font-weight:700; fill:#2b2f36}
  .door-frame{fill:#8996a8} .door-glass{fill:#1a2230} .door-mat{fill:#a0522d} .door-mat-t{font-family:var(--sans); font-size:7px; font-weight:700; fill:#f6e7c8; text-anchor:middle; letter-spacing:.08em}
  .door-sign{fill:var(--sun)} .door-sign-t{font-family:var(--hand); font-size:11px; font-weight:700; fill:#4a3510; text-anchor:middle}
  .door-handle{fill:#c9d2dc}

  /* ---------- 機器人 ---------- */
  .robots{position:absolute; inset:0; pointer-events:none; z-index:3}
  .rb{position:absolute; left:0; top:0; padding:0; border:0; background:none; cursor:pointer; pointer-events:auto;
    transition:transform var(--walk,2.4s) ease-in-out, opacity .45s ease}
  .rb.hidden{opacity:0; pointer-events:none}
  .rb.fade{opacity:0}
  .rb svg{display:block; width:100%; height:100%; overflow:visible}
  .rb.face-r svg{transform:scaleX(-1)}
  .rb.pop svg{animation:pop .7s cubic-bezier(.3,1.6,.5,1) both; animation-delay:var(--delay,0s)}
  .rb .head,.rb .body,.rb .arm{fill:var(--c)}
  .rb .visor{fill:#1f2630}
  .rb .eyes-open rect{fill:#7ff5df}
  .rb .eyes-shut path,.rb .eyes-x path{fill:none; stroke:#7ff5df; stroke-width:2.2; stroke-linecap:round}
  .rb .ant-line{stroke:#5b6472; stroke-width:2.5}
  .rb .ant{fill:#9aa3ae}
  .rb .leg{fill:#5b6472}
  .rb .badge{font-family:var(--sans); font-weight:900; font-size:11px; fill:rgba(255,255,255,.95); text-anchor:middle}
  .rb .mug rect{fill:#fffdf6} .rb .mug path{fill:none; stroke:#fffdf6; stroke-width:1.6}
  .rb .zz text{font-family:var(--sans); font-weight:700; fill:#8a95a5; font-size:12px}
  .rb .smoke circle{fill:#9aa3ae}
  .rb .alarm circle{fill:var(--red)} .rb .alarm text,.rb .qmark text{font-family:var(--sans); font-weight:900; font-size:11px; fill:#fff; text-anchor:middle}
  .rb .qmark circle{fill:#3b82f6}
  .rb .spark path{fill:var(--sun)}
  .zz,.smoke,.qmark,.alarm,.spark,.mug,.eyes-shut,.eyes-x{display:none}
  .rb-inner,.head-g,.arm-l,.arm-r-g,.leg{transform-box:fill-box}
  .rb-inner{transform-origin:50% 100%} .head-g{transform-origin:50% 100%}
  .arm-l{transform-origin:100% 50%} .arm-r-g{transform-origin:0% 50%} .leg{transform-origin:50% 0%}
  .pose-sit .legs{display:none}

  .act-type .arm-l{animation:type .42s ease-in-out infinite alternate}
  .act-type .ant{fill:#36d399}
  .act-sleep .eyes-open{display:none} .act-sleep .eyes-shut{display:inline} .act-sleep .zz{display:inline}
  .act-sleep .zz text{animation:zfloat 2.8s ease-in infinite} .act-sleep .zz text+text{animation-delay:1.4s}
  .act-sleep .rb-inner{animation:breathe 3.4s ease-in-out infinite}
  .act-coffee .mug{display:inline} .act-coffee .arm-r-g{animation:sip 5s ease-in-out infinite}
  .act-relax .rb-inner{animation:sway 4.5s ease-in-out infinite}
  .act-look .head-g{animation:lookup 7s ease-in-out infinite}
  .act-panic .eyes-open{display:none} .act-panic .eyes-x,.act-panic .smoke,.act-panic .alarm{display:inline}
  .act-panic .rb-inner{animation:shake .35s linear infinite} .act-panic .ant{fill:var(--red)}
  .act-panic .smoke circle{animation:smoke 2s ease-out infinite} .act-panic .smoke circle+circle{animation-delay:1s}
  .act-cheer .spark{display:inline} .act-cheer .rb-inner{animation:hop 1.3s ease-in-out infinite}
  .act-cheer .arm-r-g{transform:rotate(-55deg)} .act-cheer .ant{fill:#36d399}
  .act-lost .qmark{display:inline} .act-lost .head-g{animation:lookaround 3.2s ease-in-out infinite}
  .act-ready .ant{fill:var(--amber); animation:blink 1s steps(2) infinite}
  .act-ready .rb-inner{animation:stretch 3.6s ease-in-out infinite}
  .act-grey{filter:grayscale(1); opacity:.5}
  .walking .legs{display:inline}
  .walking .leg-l{animation:leg .42s ease-in-out infinite alternate}
  .walking .leg-r{animation:leg .42s ease-in-out infinite alternate-reverse}
  .walking .rb-inner{animation:bob .42s ease-in-out infinite alternate}

  @keyframes type{to{transform:translateY(2.5px)}}
  @keyframes flick{50%{opacity:.35}}
  @keyframes blink{100%{opacity:.2}}
  @keyframes zfloat{0%{transform:translate(0,4px); opacity:0} 30%{opacity:1} 100%{transform:translate(6px,-10px); opacity:0}}
  @keyframes breathe{50%{transform:scaleY(.965)}}
  @keyframes sip{0%,35%,70%,100%{transform:rotate(0)} 45%,60%{transform:rotate(-40deg)}}
  @keyframes sway{0%,100%{transform:rotate(-2deg)} 50%{transform:rotate(2deg)}}
  @keyframes lookup{0%,60%,100%{transform:translateY(0)} 70%,90%{transform:translateY(-1.5px) rotate(-6deg)}}
  @keyframes shake{25%{transform:translateX(-1.2px)} 75%{transform:translateX(1.2px)}}
  @keyframes smoke{0%{transform:translateY(0) scale(.6); opacity:.85} 100%{transform:translateY(-14px) scale(1.5); opacity:0}}
  @keyframes hop{0%,100%{transform:translateY(0)} 30%{transform:translateY(-8px)} 45%{transform:translateY(0)}}
  @keyframes lookaround{0%,100%{transform:rotate(-9deg)} 50%{transform:rotate(9deg)}}
  @keyframes stretch{0%,78%,100%{transform:scaleY(1)} 86%{transform:scaleY(1.06)}}
  @keyframes leg{from{transform:rotate(-14deg)} to{transform:rotate(14deg)}}
  @keyframes bob{to{transform:translateY(-2px)}}
  @keyframes pop{from{transform:scale(.3); opacity:0} to{transform:scale(1); opacity:1}}
  @keyframes steam{0%{opacity:0; transform:translateY(4px)} 30%{opacity:.8} 100%{opacity:0; transform:translateY(-10px)}}
  @keyframes ring{25%{transform:rotate(-3deg)} 75%{transform:rotate(3deg)}}

  /* ---------- 街道與打卡紀錄 ---------- */
  .street{background:#3b414c; border-top:14px solid #7d8593; padding-bottom:40px;
    background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.4) 0 46px,transparent 46px 96px); background-size:100% 4px; background-repeat:no-repeat; background-position:0 22px}
  .street .wrap{padding-top:44px}
  .tape{background:#f7f4ec; border-radius:6px; padding:14px 16px 6px; color:var(--ink);
    background-image:repeating-linear-gradient(180deg,transparent 0 31px,rgba(77,88,104,.12) 31px 32px)}
  .tape h2{margin:0 0 6px; font-family:var(--hand); font-size:1.1rem}
  .tape ol{list-style:none; margin:0; padding:0}
  .tape li{display:grid; grid-template-columns:8.5em 1fr auto; gap:10px; align-items:baseline; min-height:32px; padding:4px 0; font-size:.88rem}
  .tape time{font-variant-numeric:tabular-nums; color:var(--muted)}
  .tape a{color:inherit}
  .ok-t{color:var(--green); font-weight:700} .bad-t{color:var(--red); font-weight:700} .run-t{color:#b07a00; font-weight:700}
  .about{color:#d7dde6; font-size:.82rem; margin-top:18px; max-width:68ch}

  /* ---------- 詳細抽屜 ---------- */
  .scrim{position:fixed; inset:0; background:rgba(20,26,36,.45); opacity:0; pointer-events:none; transition:opacity .2s; z-index:9}
  .scrim.open{opacity:1; pointer-events:auto}
  .drawer{position:fixed; top:0; right:0; bottom:0; width:min(440px,100%); background:var(--paper); color:var(--ink);
    transform:translateX(102%); transition:transform .25s ease; overflow-y:auto; z-index:10;
    padding:calc(18px + env(safe-area-inset-top,0px)) 20px calc(28px + env(safe-area-inset-bottom,0px));
    box-shadow:-12px 0 30px rgba(0,0,0,.25)}
  .drawer.open{transform:none}
  .drawer h2{margin:0; font-size:1.35rem; font-weight:900}
  .drawer h3{margin:20px 0 6px; font-size:.95rem; font-weight:900}
  .drawer p{margin:0 0 6px}
  .chip{display:inline-block; font-size:.8rem; font-weight:700; padding:2px 10px; border-radius:999px; margin-top:6px; background:#eef0f3}
  .chip.st-work{background:#d6f3e3; color:#0f6b47} .chip.st-fail,.chip.st-miss{background:#ffd4d0; color:#8f1d22}
  .chip.st-soon{background:#ffe6b8; color:#7a5300} .chip.st-idle,.chip.st-leave{background:#eef0f3; color:#4d5868}
  .dl{display:grid; grid-template-columns:5.5em 1fr; gap:4px 10px; font-size:.92rem}
  .dl dt{color:var(--muted)} .dl dd{margin:0}
  .runs{list-style:none; margin:0; padding:0; font-size:.88rem}
  .runs li{padding:7px 0; border-bottom:1px solid #eceef1; display:grid; grid-template-columns:1fr auto; gap:2px 10px}
  .runs .why{grid-column:1/-1; color:#8f1d22; font-size:.82rem}
  .runs a{color:#2563eb}
  .manual{margin:0; padding-left:1.2em; font-size:.92rem} .manual li{margin-bottom:6px}
  .links{display:flex; flex-wrap:wrap; gap:8px; margin-top:16px}
  .links a{display:inline-block; background:var(--ink); color:#fff; text-decoration:none; border-radius:8px; padding:7px 14px; font-size:.88rem; font-weight:700}
  .close{position:sticky; top:0; float:right; background:#eef0f3; border:0; border-radius:999px; width:36px; height:36px; font-size:1.2rem; cursor:pointer}

  @media (max-width:640px){
    body{font-size:14px}
    .room{flex-direction:column; align-items:stretch}
    .desks{grid-template-columns:repeat(2,minmax(0,1fr))}
    .lounge{flex:none; width:100%; max-width:240px; align-self:center; margin-top:0}
    .floor-sign .sub{flex-basis:100%}
    .orb{width:40px; height:40px; right:2%}
    .tape li{grid-template-columns:1fr auto; gap:0 10px}

  const tpeRule = (on, h, mi) => ({ day: (y, m, d, w) => on(y, m, d, w) ? [atTp(y, m, d, h, mi)] : [] });
  function cronField(expr, min, max) {
    if (expr === "*") return null;
    const set = new Set();
    for (const part of expr.split(",")) {
      const [range, stepStr] = part.split("/"), step = stepStr ? +stepStr : 1;

  function cronSched(expr) {
    const f = String(expr).trim().split(/\s+/);

    const mins = cronField(f[0], 0, 59), hours = cronField(f[1], 0, 23), dom = cronField(f[2], 1, 31), mon = cronField(f[3], 1, 12);

    const cur = `${t.y}-${pad(t.m)}`, nxt = `${nm[0]}-${pad(nm[1])}`;
    const curB = state.bMonths.includes(cur), nxtB = state.bMonths.includes(nxt);
    const monthEnd = atTp(nm[0], nm[1], 1), weekly = byId["hopekids-bot|.github/workflows/weekly.yml"];
    if (weekly && curB !== nxtB && monthEnd - now <= 10 * DAY) {
      const first = prevNext(weekly.work, new Date(monthEnd.getTime() - 1)).next;
      out.push({ tone: "todo", target: weekly.id, text: `服事推播本月用 ${curB ? "B" : "A"} 帳號，${nm[1]}/1 起改用 ${nxtB ? "B" : "A"} 帳號。${fmt(first, false)} 10:00 第一次推播前，要在服事群組把 ${curB ? "B" : "A"} 移出、把 ${nxtB ? "B" : "A"} 邀進來。` });
    }
    if (weekly) { const wk = ev[weekly.id];
      if (wk.next && state.skip.includes(ymd(wk.next))) out.push({ tone: "todo", target: weekly.id, text: `${fmt(wk.next, false)} 的服事推播設定為停發，小週會醒來但不發訊息。` }); }
    for (const p of Object.values(PATS)) { const dl = daysLeft(p, now);
      if (dl <= 30) out.push({ tone: dl < 0 ? "alert" : "todo", target: "clock",
        text: dl < 0 ? `金鑰 ${p.secret} 已過期，${p.serves}都叫不醒。點這裡看怎麼換新。` : `金鑰 ${p.secret} 再 ${dl} 天到期，到期前重新產生並貼回 Cloudflare。` }); }
    if (!out.some(n => n.tone === "alert") && Object.keys(state.runs).length) out.unshift({ tone: "ok", text: "所有機器人都照表上工，沒有異常。" });
    return out;
  }
  function summaryText(now) {
    const ev = state.evals, staff = JOBS.filter(j => !j.leave);
    if (!Object.keys(state.runs).length) return state.error === "rate" ? "GitHub 查詢次數暫時用完，稍後自動再試。" : state.error ? "連不上 GitHub，請確認網路後按重新整理。" : "正在向 GitHub 查詢每位機器人的出勤紀錄…";
    const trouble = staff.filter(j => ["miss", "fail"].includes(ev[j.id].st));
    if (trouble.length) return `${trouble.length} 位需要處理：${trouble.map(j => `${j.name}${label[ev[j.id].st]}`).join("、")}。`;
    const working = staff.filter(j => ev[j.id].st === "work");
    if (working.length) return `${working.map(j => j.name).join("、")}正在上班，其他人在交誼廳休息。`;
    const up = staff.filter(j => ev[j.id].next).sort((a, b) => ev[a.id].next - ev[b.id].next)[0];
    return up ? `大家都在交誼廳休息。下一位上工的是${up.name}，${fmt(ev[up.id].next)}（${rel(ev[up.id].next, now)}）。` : "大家都在交誼廳休息。";
  }
  function tapeHTML() {
    const all = Object.values(state.runs).flat().sort((a, b) => new Date(b.created_at) - new Date(a.created_at)).slice(0, 14);
    if (!all.length) return `<li><span>${state.error ? "讀不到紀錄" : "讀取中…"}</span></li>`;
    return all.map(r => {
      const job = byId[`${r.repository.name}|${runPath(r)}`];
      const who = job ? `${job.name}（${job.role}）` : runPath(r).includes("watchdog") ? "前保全（已離職）" : `前員工（${r.name}，已離職）`;
      return `<li><time>${fmt(new Date(r.created_at))}</time><span>${esc(who)}</span>
        <a class="res ${resultCls(r)}" href="${esc(r.html_url)}" target="_blank" rel="noopener">${result(r)}</a></li>`;
    }).join("");
  }
  function renderFresh(now) {
    const parts = [];
    if (state.fetchedAt) parts.push(`${rel(state.fetchedAt, now).replace("1 分鐘前", "剛剛")}更新`);
    if (state.error === "rate") parts.push(`<span class="warn">GitHub 每小時免費查詢 60 次已用完，${fmt(new Date(state.pauseUntil))} 後恢復</span>`);
    else if (state.error === "net") parts.push(`<span class="warn">有資料讀取失敗，顯示的是上次的資料</span>`);
    else if (state.rate) parts.push(`GitHub 查詢額度剩 ${state.rate.rem} 次`);
    document.getElementById("fresh").innerHTML = parts.join(`<span aria-hidden="true">／</span>`);
  }

  // ---------- 更新畫面 ----------
  function update() {
    if (!JOBS.length) applyRoster();
    const sig = JOBS.map(j => `${j.id}:${j.floor}:${j.leave}`).join(",");
    if (sig !== builtSig) { build(); builtSig = sig; }
    if (!tick.phase) tick();
    const now = new Date(), night = tick.phase === "night" || tick.phase === "dusk";
    for (const j of JOBS) state.evals[j.id] = evaluate(j, now);
    if (DEMO) demo(now);
    state.clock = evalClock();
    for (const j of JOBS) {
      const el = floorsEl.querySelector(`[data-desk=${sel(j.id)}]`), e = state.evals[j.id];
      if (!el) continue;
      el.className = `station st-${e.st}`;
      el.setAttribute("aria-label", `${j.name}，${j.role}，${label[e.st]}。打開工作說明`);
      el.querySelector(".stat").textContent = statLine(j, e, now);
      el.querySelector(".meta").textContent = nextLine(j, e, now);
    }
    const c = state.clock, clockSt = document.getElementById("clockSt");
    if (clockSt) {
      clockSt.className = `station st-${c.st}`;
      clockSt.querySelector(".stat").textContent = c.st === "miss" ? `叫不醒 ${c.missed.map(j => j.name).join("、")}` : c.st === "work" ? "正在叫機器人上工" : c.st === "unknown" ? (state.error ? "讀不到 GitHub" : "讀取中") : "準時打卡中";
      clockSt.querySelector(".meta").textContent = c.next ? `下次響 ${fmt(c.next)}，${rel(c.next, now)}` : "";
      const keyAlert = Object.values(PATS).some(p => daysLeft(p, now) <= 30), safe = document.getElementById("safeSt");
      safe.className = `station ${keyAlert ? "st-fail" : "st-idle"}`;
      safe.querySelector(".safe-art").innerHTML = safeSVG(now);
      safe.querySelector(".stat").textContent = keyAlert ? "有金鑰快到期了" : "兩把金鑰都還有效";
      safe.querySelector(".meta").textContent = Object.values(PATS).map(p => `${p.secret} 到 ${p.expires.replace(/-/g, "/")}`).join("，");
      const lost = JOBS.filter(j => state.evals[j.id].st === "miss"), door = document.getElementById("doorSt");
      door.className = `station door-slot ${lost.length ? "st-miss" : "st-idle"}`;
      door.querySelector(".stat").textContent = lost.length ? `${lost.map(j => j.name).join("、")}被關在門口` : "門口沒有人";
      door.querySelector(".meta").textContent = lost.length ? "沒被打卡鐘叫醒，進不了辦公室" : "";
    }
    for (const f of floorsEl.querySelectorAll(".floor")) {
      const id = f.dataset.floor, lit = JOBS.some(j => j.floor === id && state.evals[j.id].st === "work") || (id === "srv" && c.st === "work");
      f.classList.toggle("dim", !lit && night);
    }
    state.targets = targets(night);
    for (const l of floorsEl.querySelectorAll(".lounge")) {
      const id = l.dataset.lounge;
      l.classList.toggle("has-coffee", JOBS.some(j => j.floor === id && state.targets[j.id] && state.targets[j.id].act === "coffee"));
    }
    positionAll(false);
    const board = document.getElementById("board");
    board.innerHTML = `<h2>公告欄</h2>` + notes(now).map(n => n.target
      ? `<button type="button" class="note ${n.tone}" data-open="${esc(n.target)}">${esc(n.text)}</button>`
      : `<div class="note ${n.tone}">${esc(n.text)}</div>`).join("");
    document.getElementById("summary").textContent = summaryText(now);
    document.getElementById("tape").innerHTML = tapeHTML();
    renderFresh(now);
    tick();
    if (openId) fillDrawer(openId, false);
  }

  // ---------- 時鐘與天色 ----------
  function tick() {
    const t = tp(new Date());
    document.getElementById("clock").innerHTML = `${pad(t.h)}:${pad(t.mi)}<small>${pad(t.s)}</small>`;
    document.getElementById("clockDate").textContent = `台北時間 ${t.y}/${t.m}/${t.d}（${WEEK[t.dow]}）`;
    const hh = document.getElementById("handH"), mm = document.getElementById("handM");
    if (hh) { hh.style.transform = `rotate(${(t.h % 12) * 30 + t.mi / 2}deg)`; mm.style.transform = `rotate(${t.mi * 6}deg)`; }
    const hour = t.h + t.mi / 60;
    const phase = hour >= 5 && hour < 6.5 ? "dawn" : hour >= 6.5 && hour < 16.5 ? "day" : hour >= 16.5 && hour < 18.5 ? "dusk" : "night";
    if (phase !== tick.phase) {
      const first = !tick.phase;
      tick.phase = phase;
      const skies = { dawn: ["#f4a98a", "#a9c7e6", "#2b2f36"], day: ["#7fbde8", "#d4ebf8", "#22344a"], dusk: ["#3d4f86", "#f0a36c", "#fff6ea"], night: ["#141d36", "#33467a", "#eef2fb"] };
      const [a, b, ink] = skies[phase], root = document.documentElement.style;
      root.setProperty("--sky-top", a); root.setProperty("--sky-bot", b); root.setProperty("--sky-ink", ink);
      document.body.classList.remove("ph-dawn", "ph-day", "ph-dusk", "ph-night");
      document.body.classList.add(`ph-${phase}`);
      if (!first && JOBS.length) update();          // 天亮或天黑時，休息的機器人換動作
    }
  }
  (function stars() { let h = "";
    for (let i = 0; i < 46; i++) h += `<i style="left:${(i * 37.7) % 100}%;top:${(i * 53.3) % 92}%;opacity:${.35 + (i % 5) / 8}"></i>`;
    document.getElementById("stars").innerHTML = h; })();

  // ---------- 詳細抽屜 ----------
  const drawer = document.getElementById("drawer"), scrim = document.getElementById("scrim");
  let openId = null, lastFocus = null;
  const stepCache = {};
  async function failedStep(run) {
    if (run.id in stepCache) return stepCache[run.id];
    stepCache[run.id] = null;
    try {
      const r = await fetch(`${API}/repos/${OWNER}/${run.repository.name}/actions/runs/${run.id}/jobs`, { headers: { Accept: "application/vnd.github+json" } });
      if (r.ok) { const steps = ((await r.json()).jobs || []).flatMap(j => j.steps || []); const s = steps.find(x => FAIL.has(x.conclusion)); stepCache[run.id] = s ? s.name : null; }
    } catch {}
    return stepCache[run.id];
  }
  const wakeLabel = (job, r) => {
    if (r.event === "schedule") return "GitHub 排程";
    if (r.event === "dynamic" || r.event === "push") return "內容更新";
    if (job.by === "clock" && job.work) { const c = new Date(r.created_at), p = prevNext(job.work, new Date(c.getTime() + MIN)).prev;
      return p && c - p >= -MIN && c - p < 10 * MIN ? "打卡鐘叫醒" : "手動執行"; }
    return "手動執行";
  };
  function fillDrawer(id, focus) {
    const now = new Date();
    let html = `<button class="close" type="button" aria-label="關閉" data-close>×</button>`;
    if (id === "clock") {
      const c = state.clock;
      html += `<h2 id="dTitle">打卡鐘</h2><span class="chip st-${c.st}">${c.st === "miss" ? "有機器人叫不醒" : c.st === "unknown" ? "讀不到狀態" : "準時打卡中"}</span>
        <h3>工作內容</h3><p>Cloudflare 上的排程（Worker：hopekids-line-hook）。每天 06:00、10:00、19:00 準時醒來，依星期幾叫醒晨讀機、小週、表單姐、小聚。GitHub 自己的排程常晚好幾個小時，所以改由它負責叫人。</p>
        <h3>最近叫醒情況</h3><ul class="runs">${JOBS.filter(j => j.by === "clock").map(j => { const e = state.evals[j.id];
          return `<li><span>${esc(j.name)}　${e.missedAt ? `${fmt(e.missedAt)} 沒叫醒` : e.prev ? `${fmt(e.prev)} 有叫醒` : "還沒到上工日"}</span><span class="${e.missedAt ? "bad-t" : "ok-t"}">${e.missedAt ? "✗" : e.prev ? "✓" : ""}</span></li>`; }).join("")}</ul>
        <h3>金鑰</h3><dl class="dl">${Object.values(PATS).map(p => { const dl = daysLeft(p, now);
          return `<dt>${p.secret}</dt><dd>GitHub 金鑰「${p.token}」，叫醒${p.serves}。${p.expires.replace(/-/g, "/")} 到期（${dl < 0 ? "已過期" : `剩 ${dl} 天`}）</dd>`; }).join("")}</dl>
        <h3>故障手冊</h3><ol class="manual">
          <li>機器人站在大門口、又完全沒有紀錄，多半是金鑰過期。到 GitHub 的 Fine-grained tokens 頁找對應的金鑰，按 Regenerate token，期限選最長，複製新金鑰。</li>
          <li>Cloudflare → Workers &amp; Pages → hopekids-line-hook → Settings → Variables and Secrets，編輯對應的 secret，貼上新金鑰後按 Deploy。</li>
          <li>金鑰沒過期但還是叫不醒：同一個 Worker 的 Settings → Trigger events，確認 0 22 * * *、0 2 * * *、0 11 * * * 三個排程都還在。</li>
          <li>漏掉的訊息可以在各機器人的 GitHub 工作頁按 Run workflow 補發。</li>
        </ol>
        <div class="links"><a href="https://github.com/settings/personal-access-tokens" target="_blank" rel="noopener">打開 GitHub 金鑰頁</a><a href="https://dash.cloudflare.com" target="_blank" rel="noopener">打開 Cloudflare</a></div>`;
    } else {
      const job = byId[id], e = state.evals[id];
      if (!job || !e) return;
      const t = tp(now), acct = job.line ? (state.bMonths.includes(`${t.y}-${pad(t.m)}`) ? "B 帳號（@605epctp）" : "A 帳號（原本那隻）") : null;
      const recent = e.runs.slice(0, 8);
      const wfUrl = job.path.startsWith(".github/workflows/") ? `/workflows/${job.path.split("/").pop()}` : "";
      html += `<h2 id="dTitle">${esc(job.name)}</h2><p style="margin:2px 0 0;color:var(--muted)">${esc(job.role)}</p>
        <span class="chip st-${e.st}">${esc(statLine(job, e, now))}</span>
        <h3>工作內容</h3><p>${esc(job.duty)}</p>
        <h3>上班時間</h3><p>${esc(job.hours)}</p>
        <dl class="dl">${e.next ? `<dt>下次上工</dt><dd>${fmt(e.next)}（${rel(e.next, now)}）</dd>` : ""}${e.last ? `<dt>上次完成</dt><dd>${fmt(new Date(e.last.created_at))}，${result(e.last)}</dd>` : ""}${acct ? `<dt>LINE 帳號</dt><dd>本月用 ${acct}</dd>` : ""}<dt>所在位置</dt><dd>${esc(job.repo)} / ${esc(job.path)}</dd></dl>
        <h3>最近紀錄</h3>${recent.length ? `<ul class="runs">${recent.map(r => `<li data-run="${r.id}"><span>${fmt(new Date(r.created_at))}　${wakeLabel(job, r)}</span>
          <a class="${resultCls(r)}" href="${esc(r.html_url)}" target="_blank" rel="noopener">${result(r)}</a>${FAIL.has(r.conclusion) ? `<span class="why">正在查卡在哪一步…</span>` : ""}</li>`).join("")}</ul>` : `<p>還沒有紀錄。</p>`}
        <h3>故障手冊</h3><ol class="manual">${job.manual.map(m => `<li>${esc(m)}</li>`).join("")}</ol>
        <div class="links"><a href="https://github.com/${OWNER}/${esc(job.repo)}/actions${wfUrl}" target="_blank" rel="noopener">在 GitHub 打開這個工作</a></div>`;
      recent.filter(r => FAIL.has(r.conclusion)).slice(0, 4).forEach(async r => {
        const s = await failedStep(r), el = drawer.querySelector(`[data-run="${r.id}"] .why`);
        if (el) el.textContent = s ? `卡在「${s}」這一步` : "沒查到是哪一步，點「失敗」看 GitHub 紀錄";
      });
    }
    drawer.innerHTML = html;
    if (focus) drawer.querySelector("[data-close]").focus();
  }
  function openDrawer(id) { lastFocus = document.activeElement; openId = id; fillDrawer(id, true); drawer.classList.add("open"); scrim.classList.add("open"); }
  function closeDrawer() {
    openId = null; drawer.classList.remove("open"); scrim.classList.remove("open");
    if (lastFocus && document.contains(lastFocus)) lastFocus.focus();
  }
  document.addEventListener("click", ev => {
    const o = ev.target.closest("[data-open]"); if (o) { openDrawer(o.dataset.open); return; }
    if (ev.target.closest("[data-close]") || ev.target === scrim) closeDrawer();
  });
  document.addEventListener("keydown", ev => { if (ev.key === "Escape" && openId) closeDrawer(); });
  document.getElementById("refresh").addEventListener("click", () => refresh(true));

  // ---------- 網址加 ?demo：輪流播放幾種情境（不是真實資料） ----------
  function demo(now) {
    const ids = Object.keys(KNOWN), e = state.evals;
    const set = (i, patch) => { const x = e[ids[i]]; if (x) Object.assign(x, { cheer: false }, patch); };
    const scene = DEMO_SCENE ? DEMO_SCENE % 3 : Math.floor(Date.now() / 8000) % 3;
    for (const id of ids) if (e[id]) Object.assign(e[id], { st: "idle", cheer: false });
    const fake = { status: "in_progress", created_at: new Date(now - 2 * MIN).toISOString() };
    if (scene === 1) {
      set(0, { st: "work", active: fake }); set(4, { st: "work", active: fake });
      if (e[ids[1]] && e[ids[1]].last) set(1, { st: "fail", last: { ...e[ids[1]].last, conclusion: "failure" } });
      set(5, { st: "soon", next: new Date(now.getTime() + 12 * MIN) }); set(3, { st: "idle", cheer: true });
    }
    if (scene === 2) { set(4, { st: "miss", missedAt: e[ids[4]] && e[ids[4]].prev || new Date(now - H) }); set(5, { st: "work", active: fake }); }
  }

  // ---------- 啟動 ----------
  loadCachedRoster();
  applyRoster();
  update();
  function hotRepos(now) {
    const set = new Set();
    for (const j of JOBS) { const e = state.evals[j.id]; if (!e || j.leave) continue;
      if (e.st === "work" || (e.next && e.next - now < 3 * MIN)) set.add(j.repo);
      const rule = j.wake || j.work, p = rule ? prevNext(rule, now).prev : null;
      if (p && now - p < 12 * MIN && !e.runs.some(r => new Date(r.created_at) >= p - MIN)) set.add(j.repo);
    }
    return [...set];
  }
  async function poll() {
    if (!document.hidden) {
      const now = new Date(), hot = hotRepos(now);
      if (Date.now() - lastFull >= FULL_EVERY) await refresh(false);
      else if (hot.length) await refresh(false, hot);
    }
    setTimeout(poll, hotRepos(new Date()).length ? HOT_EVERY : 60e3);
  }
  refresh(false).then(() => setTimeout(poll, HOT_EVERY));
  setInterval(tick, 1000);
  setInterval(() => { if (!document.hidden) update(); }, DEMO ? 8000 : 30e3);
  document.addEventListener("visibilitychange", () => { if (!document.hidden && Date.now() - lastFull > FULL_EVERY / 2) refresh(false); });
  let rsz;
  new ResizeObserver(() => { clearTimeout(rsz); rsz = setTimeout(() => positionAll(true), 200); }).observe(building);
  if (document.fonts) document.fonts.ready.then(() => positionAll(true));
})();
</script>
</body>
</html>
