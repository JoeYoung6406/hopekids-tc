<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>桌面跑道佈置｜關卡一 遊戲ㄔㄨㄢˊHOPE</title>
<meta name="description" content="Hope Kids 台中分部 10/4 闖關遊戲 關卡一：桌面乒乓球跑道佈置示意圖。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chewy&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1c3f52; --muted:#5c7d8c; --bg:#f2fbfc; --card:#ffffff; --line:#dcecef;
    --aqua:#1fa6c9; --aqua-deep:#0e7f9c; --coral:#ff7a59; --sun:#f2a900;
    --shadow:0 10px 26px rgba(31,166,201,.14);
  }
  *{box-sizing:border-box}
  body{
    margin:0; color:var(--ink); background:
      radial-gradient(900px 420px at 50% -140px, #d9f4f8, transparent 72%), var(--bg);
    font-family:"Noto Sans TC",system-ui,"Microsoft JhengHei",sans-serif;
    line-height:1.75; -webkit-font-smoothing:antialiased;
  }
  .page{max-width:760px; margin:0 auto; padding:40px 20px 72px;}

  .eyebrow{font-weight:900; font-size:.82rem; letter-spacing:.14em; text-transform:uppercase; color:var(--aqua-deep); margin:0 0 10px}
  h1{
    font-family:"Chewy","Noto Sans TC",cursive; font-weight:400;
    font-size:clamp(1.9rem,6vw,2.5rem); margin:0 0 28px; color:var(--aqua-deep);
    text-shadow:0 2px 0 rgba(14,127,156,.15);
  }
  h2{display:flex; align-items:center; gap:10px; font-size:1.15rem; font-weight:900; margin:0 0 6px}
  h2 .num{
    flex:none; width:32px; height:32px; border-radius:50%; background:var(--aqua); color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:1rem;
  }
  .sub{color:var(--muted); font-size:.9rem; margin:0 0 20px}
  section{margin-top:44px}

  .tip{
    margin-top:14px; padding:14px 16px; border-left:4px solid var(--coral);
    background:#fff7f3; border-radius:0 12px 12px 0; font-size:.9rem;
  }
  .tip b{color:var(--coral)}

  /* setup diagram */
  .setup-wrap{background:var(--card); border:1.5px solid var(--line); border-radius:18px; padding:18px; box-shadow:var(--shadow)}
  .setup-wrap svg{width:100%; height:auto; display:block}
  .legend{display:flex; flex-wrap:wrap; gap:10px 18px; margin-top:14px; font-size:.86rem}
  .legend .l{display:flex; align-items:center; gap:6px}
  .legend .sw{width:14px; height:14px; border-radius:4px; flex:none}

  footer{text-align:center; margin-top:48px; color:var(--muted); font-size:.82rem}
  footer a{color:var(--aqua-deep); font-weight:700; text-decoration:none}
</style>
</head>
<body>
<div class="page">

  <p class="eyebrow">Hope Kids 台中分部 · 10/4 闖關遊戲 · 關卡一</p>
  <h1>桌面跑道佈置</h1>

  <section>
    <h2><span class="num">🏓</span>場地佈置示意圖</h2>
    <p class="sub">由上往下看的桌面配置，3 條跑道平均分布，孩子從起點吹乒乓球過去。</p>

    <div class="setup-wrap">
      <svg viewBox="0 0 480 380">
        <!-- table -->
        <rect x="70" y="40" width="340" height="280" rx="14" fill="#d5f0f6" stroke="#1fa6c9" stroke-width="3"/>
        <text x="240" y="60" text-anchor="middle" font-size="12" fill="#0e7f9c" font-weight="700">桌面（或地板空間）</text>

        <!-- lanes (tape lines) -->
        <line x1="150" y1="290" x2="130" y2="75" stroke="#ff7a59" stroke-width="2.5" stroke-dasharray="7,5"/>
        <line x1="240" y1="290" x2="240" y2="75" stroke="#ff7a59" stroke-width="2.5" stroke-dasharray="7,5"/>
        <line x1="330" y1="290" x2="350" y2="75" stroke="#ff7a59" stroke-width="2.5" stroke-dasharray="7,5"/>

        <!-- obstacles along lanes (extension) -->
        <rect x="123" y="190" width="14" height="14" rx="3" fill="#f2a900"/>
        <rect x="233" y="160" width="14" height="14" rx="3" fill="#f2a900"/>
        <rect x="340" y="200" width="14" height="14" rx="3" fill="#f2a900"/>

        <!-- destination: home -->
        <rect x="90" y="48" width="80" height="28" rx="8" fill="#1fa6c9"/>
        <text x="130" y="67" text-anchor="middle" font-size="13" fill="#fff">🏠 家</text>

        <!-- destination: school -->
        <rect x="200" y="48" width="80" height="28" rx="8" fill="#4fb3d9"/>
        <text x="240" y="67" text-anchor="middle" font-size="13" fill="#fff">🏫 學校</text>

        <!-- destination: friend -->
        <rect x="310" y="48" width="80" height="28" rx="8" fill="#7fd0e0"/>
        <text x="350" y="67" text-anchor="middle" font-size="13" fill="#0e7f9c">👫 朋友</text>

        <!-- start line -->
        <line x1="100" y1="290" x2="380" y2="290" stroke="#ff7a59" stroke-width="3"/>
        <text x="240" y="310" text-anchor="middle" font-size="13" fill="#ff7a59" font-weight="700">起點（孩子蹲/坐在這排用吸管吹球）</text>

        <!-- kids -->
        <text x="150" y="330" font-size="16">🧒</text>
        <text x="200" y="330" font-size="16">🧒</text>
        <text x="280" y="330" font-size="16">🧒</text>
        <text x="330" y="330" font-size="16">🧒</text>

        <!-- card table -->
        <rect x="415" y="150" width="60" height="55" rx="8" fill="#fff" stroke="#dcecef" stroke-width="2"/>
        <text x="445" y="172" text-anchor="middle" font-size="10" fill="#5c7d8c">任務卡</text>
        <text x="445" y="188" text-anchor="middle" font-size="10" fill="#5c7d8c">行動卡</text>
        <text x="445" y="200" text-anchor="middle" font-size="9" fill="#5c7d8c">桌</text>

        <!-- teacher markers -->
        <text x="240" y="40" text-anchor="middle" font-size="14">🧑‍🏫</text>
        <text x="90" y="270" text-anchor="middle" font-size="14">🧑‍🏫</text>
        <text x="390" y="270" text-anchor="middle" font-size="14">🧑‍🏫</text>
      </svg>

      <div class="legend">
        <span class="l"><span class="sw" style="background:#1fa6c9"></span>目的地標示（貼在桌面遠端）</span>
        <span class="l"><span class="sw" style="background:#ff7a59"></span>跑道線／起點線（膠帶貼出）</span>
        <span class="l"><span class="sw" style="background:#f2a900"></span>跑道障礙物（小積木/紙杯，延伸版加入）</span>
        <span class="l"><span class="sw" style="background:#fff;border:1.5px solid #dcecef"></span>任務卡／行動卡抽卡桌</span>
        <span class="l">🧑‍🏫 老師定點協助</span>
      </div>
    </div>

    <div class="tip">
      📍 <b>佈置提醒</b>：三條跑道盡量平均分散、長度一致，讓孩子吹球的距離差不多公平；桌面不平整容易讓球偏離跑道，建議選平整桌面或鋪布墊；抽卡桌放在容易拿取但不擋路的位置；障礙物只在「延伸加深難度」時加入，一開始建議先淨空讓孩子熟悉玩法。
    </div>
  </section>

  <footer><a href="station-1.html">← 回關卡一教案</a></footer>

</div>
</body>
</html>
